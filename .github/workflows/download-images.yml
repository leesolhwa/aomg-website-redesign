name: Download AOMG images

on:
  push:
    paths:
      - 'img/download-images.sh'
      - '.github/workflows/download-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images from aomgofficial.com
        run: bash img/download-images.sh
      - name: List results
        run: ls -la img/
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/*.jpg img/*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new images"
          else
            git commit -m "Download AOMG images via GitHub Actions"
            git push
          fi
